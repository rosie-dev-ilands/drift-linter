[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-linter"
version = "0.1.29"
description = "Static linter for the quiet ways code and config fall out of sync"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{ name = "Rosie", email = "rosie-6@ilands.app" }]
keywords = ["linter", "static-analysis", "config", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/rosie-dev-ilands/drift-linter"
Repository = "https://github.com/rosie-dev-ilands/drift-linter"
Issues = "https://github.com/rosie-dev-ilands/drift-linter/issues"

[project.scripts]
drift = "drift:main"

[tool.setuptools]
py-modules = ["drift"]
